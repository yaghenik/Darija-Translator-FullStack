<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Darija Translator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Palette de couleurs */
            --bg-gradient-start: #C4B5FD;
            --bg-gradient-end: #93C5FD;
            --btn-gradient-start: #A78BFA;
            --btn-gradient-end: #60A5FA;
            --card-bg: #FFFFFF;
            --text-dark: #1F2937;
            --text-gray: #6B7280;
            --border-color: #E5E7EB;
            --input-bg: #F9FAFB;
            --result-text: #4F46E5;
            --error-text: #DC2626;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            margin: 0;
            padding: 20px;
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 380px;
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        /* --- NOUVEAU : En-tête avec Titre --- */
        .app-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .app-title {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .lang-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-gray);
        }

        /* --- NOUVEAU : Switch Autofill --- */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .switch-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-gray);
            cursor: pointer;
        }

        /* Le Switch CSS pur */
        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background: linear-gradient(90deg, var(--btn-gradient-start), var(--btn-gradient-end));
        }
        input:checked + .slider:before { transform: translateX(16px); }


        .input-group { margin-bottom: 20px; }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-gray);
            margin-bottom: 8px;
            margin-left: 4px;
        }

        .styled-box {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background-color: var(--input-bg);
            font-family: inherit;
            font-size: 15px;
            color: var(--text-dark);
            resize: none;
            display: block;
        }

        textarea.styled-box {
            height: 100px;
            transition: all 0.2s;
        }

        textarea.styled-box:focus {
            outline: none;
            border-color: var(--btn-gradient-end);
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, var(--btn-gradient-start), var(--btn-gradient-end));
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(167, 139, 250, 0.4);
            margin-bottom: 24px;
        }

        .btn-primary:hover {
            box-shadow: 0 6px 12px -1px rgba(167, 139, 250, 0.5);
            filter: brightness(1.05);
        }
        .btn-primary:active { transform: scale(0.98); }

        .output-group { width: 100%; }

        #result-container {
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #result-text {
            color: #9CA3AF;
            font-style: italic;
            word-wrap: break-word;
        }

        #result-container.success {
            background-color: #FFFFFF;
            border-color: #A7F3D0;
        }

        #result-container.success #result-text {
            color: var(--result-text);
            font-weight: 600;
            font-style: normal;
            font-size: 18px;
            text-align: right;
            direction: rtl;
        }

        .error-message {
            color: var(--error-text);
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
            display: none;
            background: #FEF2F2;
            padding: 8px;
            border-radius: 8px;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #FFFFFF;
            animation: spin 0.8s linear infinite;
            margin-left: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-primary.loading .btn-text { display: none; }
        .btn-primary.loading .spinner { display: block; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="app-header">
        <h1 class="app-title">Darija Translator Pro</h1>
        <div class="lang-indicator">
            <span>🇬🇧 English</span>
            <span style="color: #A78BFA;">➜</span>
            <span>🇲🇦 Darija</span>
        </div>
    </div>

    <main>
        <div class="controls-row">
            <label for="inputText" style="margin-bottom: 0;">Source Text</label>
            
            <div class="switch-container">
                <span>Autofill</span>
                <label class="switch">
                    <input type="checkbox" id="autofillToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="input-group">
            <textarea id="inputText" class="styled-box" placeholder="Type text here..."></textarea>
        </div>

        <button id="translateBtn" class="btn-primary">
            <span class="btn-text">Translate Now</span>
            <span class="spinner"></span>
        </button>
        
        <div id="errorMessage" class="error-message"></div>

        <div class="output-group">
            <label>Translation</label>
            <div id="result-container" class="styled-box">
                <div id="result-text">Translation will appear here...</div>
            </div>
        </div>
    </main>
</div>

<script src="sidepanel.js"></script>
</body>
</html>
